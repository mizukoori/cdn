<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" role="img">
<title>规则哑火后枚举出两种摆法，总数筛掉三雷那种</title>
<desc>3×3、2 颗雷的盘面：四个数字写成四条式子，四对相减全部落在两格一雷，一格也定不了。联立化简后只剩一个自由变量，枚举出两种摆法——两雷与三雷；再用整盘只有两颗雷筛掉后者，五格全部确定。</desc>
<rect width="680" height="470" rx="12" fill="#f8f7f3"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">

<rect x="37.5" y="44" width="49" height="49" rx="5" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.8"/>
<text x="62" y="68.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#2b2b28">1</text>
<rect x="89.5" y="44" width="49" height="49" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="114" y="68.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#9a6a00">a</text>
<rect x="141.5" y="44" width="49" height="49" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="166" y="68.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#9a6a00">b</text>

<rect x="37.5" y="96" width="49" height="49" rx="5" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.8"/>
<text x="62" y="120.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#2b2b28">2</text>
<rect x="89.5" y="96" width="49" height="49" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="114" y="120.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#9a6a00">c</text>
<rect x="141.5" y="96" width="49" height="49" rx="5" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.8"/>
<text x="166" y="120.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#2b2b28">2</text>

<rect x="37.5" y="148" width="49" height="49" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="62" y="172.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#9a6a00">d</text>
<rect x="89.5" y="148" width="49" height="49" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="114" y="172.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#9a6a00">e</text>
<rect x="141.5" y="148" width="49" height="49" rx="5" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.8"/>
<text x="166" y="172.5" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#2b2b28">1</text>

<text x="216" y="58" font-size="11.5" fill="#8a8880">式</text>
<text x="272" y="58" font-size="11.5" fill="#8a8880">方程</text>
<line x1="216" y1="66" x2="644" y2="66" stroke="#e2dfd8" stroke-width="1"/>

<text x="216" y="86" font-size="12.5" fill="#4a4a46">A</text>
<text x="272" y="86" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5b4292">a + c = 1</text>
<text x="216" y="108" font-size="12.5" fill="#4a4a46">B</text>
<text x="272" y="108" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5b4292">a + c + d + e = 2</text>
<text x="216" y="130" font-size="12.5" fill="#4a4a46">C</text>
<text x="272" y="130" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5b4292">a + b + c + e = 2</text>
<text x="216" y="152" font-size="12.5" fill="#4a4a46">D</text>
<text x="272" y="152" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5b4292">c + e = 1</text>

<text x="216" y="178" font-size="12" fill="#4a4a46">能相减的四对：B−A、C−A、B−D、C−D</text>
<text x="216" y="198" font-size="12" fill="#b32d2d">每对都是 2 格装 1 颗雷 → 既不是 0 也不是 2</text>
<text x="216" y="218" font-size="12" fill="#b32d2d">四对全落空，一格都定不了</text>
<text x="216" y="244" font-size="12" fill="#4a4a46">联立化简：a = e，b = c，d = c</text>
<text x="216" y="264" font-size="12" fill="#8a8880">只剩 c 一个自由变量</text>

<line x1="36" y1="284" x2="644" y2="284" stroke="#e2dfd8" stroke-width="1"/>

<rect x="37.5" y="304" width="282" height="112" rx="10" fill="#eaf9f2" stroke="#9fe1cb" stroke-width="0.5"/>
<rect x="52" y="322" width="26" height="26" rx="4" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.6"/>
<text x="65" y="335" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b2b28">1</text>
<rect x="81" y="322" width="26" height="26" rx="4" fill="#fde3e3" stroke="#e07070" stroke-width="0.6"/>
<text x="94" y="335" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#b32d2d">■</text>
<rect x="110" y="322" width="26" height="26" rx="4" fill="#dcf5e8" stroke="#6cc39a" stroke-width="0.6"/>
<text x="123" y="335" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a6b4d">✓</text>
<rect x="52" y="351" width="26" height="26" rx="4" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.6"/>
<text x="65" y="364" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b2b28">2</text>
<rect x="81" y="351" width="26" height="26" rx="4" fill="#dcf5e8" stroke="#6cc39a" stroke-width="0.6"/>
<text x="94" y="364" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a6b4d">✓</text>
<rect x="110" y="351" width="26" height="26" rx="4" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.6"/>
<text x="123" y="364" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b2b28">2</text>
<rect x="52" y="380" width="26" height="26" rx="4" fill="#dcf5e8" stroke="#6cc39a" stroke-width="0.6"/>
<text x="65" y="393" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a6b4d">✓</text>
<rect x="81" y="380" width="26" height="26" rx="4" fill="#fde3e3" stroke="#e07070" stroke-width="0.6"/>
<text x="94" y="393" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#b32d2d">■</text>
<rect x="110" y="380" width="26" height="26" rx="4" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.6"/>
<text x="123" y="393" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b2b28">1</text>
<text x="152" y="340" font-size="13" font-weight="500" fill="#0f6e56">c = 0 → 用 2 颗雷</text>
<text x="152" y="364" font-size="11.5" fill="#5f5e5a">(1,2)、(3,2) 是雷</text>
<text x="152" y="386" font-size="11.5" fill="#5f5e5a">其余 3 格安全</text>

<rect x="361.5" y="304" width="282" height="112" rx="10" fill="#fcebeb" stroke="#f09595" stroke-width="0.5"/>
<rect x="376" y="322" width="26" height="26" rx="4" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.6"/>
<text x="389" y="335" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b2b28">1</text>
<rect x="405" y="322" width="26" height="26" rx="4" fill="#dcf5e8" stroke="#6cc39a" stroke-width="0.6"/>
<text x="418" y="335" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a6b4d">✓</text>
<rect x="434" y="322" width="26" height="26" rx="4" fill="#fde3e3" stroke="#e07070" stroke-width="0.6"/>
<text x="447" y="335" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#b32d2d">■</text>
<rect x="376" y="351" width="26" height="26" rx="4" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.6"/>
<text x="389" y="364" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b2b28">2</text>
<rect x="405" y="351" width="26" height="26" rx="4" fill="#fde3e3" stroke="#e07070" stroke-width="0.6"/>
<text x="418" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#b32d2d">■</text>
<rect x="434" y="351" width="26" height="26" rx="4" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.6"/>
<text x="447" y="364" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b2b28">2</text>
<rect x="376" y="380" width="26" height="26" rx="4" fill="#fde3e3" stroke="#e07070" stroke-width="0.6"/>
<text x="389" y="393" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#b32d2d">■</text>
<rect x="405" y="380" width="26" height="26" rx="4" fill="#dcf5e8" stroke="#6cc39a" stroke-width="0.6"/>
<text x="418" y="393" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#1a6b4d">✓</text>
<rect x="434" y="380" width="26" height="26" rx="4" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.6"/>
<text x="447" y="393" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#2b2b28">1</text>
<text x="470" y="340" font-size="13" font-weight="500" fill="#a32d2d">c = 1 → 用 3 颗雷</text>
<text x="470" y="364" font-size="11.5" fill="#5f5e5a">(1,3)(2,2)(3,1) 是雷</text>
<text x="470" y="386" font-size="11.5" fill="#a32d2d">总数只有 2 → 出局</text>

<text x="36" y="446" font-size="12.5" fill="#4a4a46">第五条「整盘只有 2 颗」压上去 → <tspan fill="#b32d2d">3 颗那种出局</tspan>，<tspan fill="#1a6b4d">5 格一次定死</tspan></text>

</g>
</svg>
