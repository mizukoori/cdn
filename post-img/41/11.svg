<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="100%" role="img">
<title>22 种摆法的份量不是 22 份</title>
<desc>堆叠条显示三种摆法按整盘雷数加权后的实际份量：6 雷组 8.00 份，7 雷组 3.01 份，8 雷组 0.12 份，合计 11.13 份；右侧虚线标出等权假设的 22 份。</desc>
<defs>
<marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', sans-serif">


<line x1="610" y1="96" x2="610" y2="192" stroke="#5b5b64" stroke-width="1" stroke-dasharray="4 4"/>
<text x="610" y="86" text-anchor="middle" font-size="12" fill="#5f5e5a">22 份</text>
<text x="610" y="212" text-anchor="middle" font-size="11.5" fill="#5f5e5a">等权假设</text>

<path d="M345 120 L600 120" fill="none" stroke="#8a3d3a" stroke-width="1" marker-start="url(#ah2)" marker-end="url(#ah2)"/>
<text x="472" y="108" text-anchor="middle" font-size="12" fill="#a32d2d">被打掉的 10.87 份</text>

<rect x="60" y="140" width="200" height="46" fill="#2e7d6b"/>
<rect x="260" y="140" width="75" height="46" fill="#8a6f33"/>
<rect x="335" y="140" width="4" height="46" fill="#8a3d3a"/>

<text x="160" y="163" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#dff2ea">8.00 份</text>
<text x="297" y="163" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#f2e4c4">3.01</text>
<path d="M341 163 L356 163" fill="none" stroke="#8a3d3a" stroke-width="0.8"/>
<text x="360" y="163" dominant-baseline="central" font-size="12" fill="#a32d2d">0.12</text>

<text x="60" y="214" font-size="12.5" fill="#2c2c2a">实际总份量 <tspan font-weight="500" fill="#2c2c2a">11.13 份</tspan></text>

<rect x="60" y="240" width="12" height="12" rx="3" fill="#2e7d6b"/>
<text x="82" y="247" dominant-baseline="central" font-size="12.5" fill="#2c2c2a">6 雷 8 种　× 1.0000 = 8.00 份（全价）</text>

<rect x="60" y="264" width="12" height="12" rx="3" fill="#8a6f33"/>
<text x="82" y="271" dominant-baseline="central" font-size="12.5" fill="#2c2c2a">7 雷 12 种　× 0.2507 = 3.01 份（打四折：多花一颗雷，补全方式只剩 1/4）</text>

<rect x="60" y="288" width="12" height="12" rx="3" fill="#8a3d3a"/>
<text x="82" y="295" dominant-baseline="central" font-size="12.5" fill="#2c2c2a">8 雷 2 种　× 0.0620 = 0.12 份（打十六分之一，细到看不见）</text>




</g>
</svg>
