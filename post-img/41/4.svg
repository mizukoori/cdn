<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 352" width="100%" role="img">
<title>僵局与子集消去</title>
<desc>一个 2×4、2 颗雷的盘面，三条局部计数规则都用不上；把数字 2 的约束减去数字 1 的约束，差集只剩一格，因此那一格必然是雷。</desc>
<defs>
<marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="352" rx="12" fill="#f8f7f3"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">

<text x="36" y="42" font-size="13.5" fill="#4a4a46">局面：2 行 4 列，共 2 颗雷　<tspan fill="#9a6a00">? = 未开</tspan></text>

<rect x="37.5" y="59.5" width="43" height="43" rx="5" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.8"/>
<text x="59" y="81" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#2b2b28">1</text>
<rect x="83.5" y="59.5" width="43" height="43" rx="5" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.8"/>
<text x="105" y="81" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#2b2b28">2</text>
<rect x="129.5" y="59.5" width="43" height="43" rx="5" fill="#ffffff" stroke="#c9c6bf" stroke-width="0.8"/>
<text x="151" y="81" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#2b2b28">1</text>
<rect x="175.5" y="59.5" width="43" height="43" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="197" y="81" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#9a6a00">?</text>

<rect x="37.5" y="105.5" width="43" height="43" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="59" y="127" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#9a6a00">?</text>
<rect x="83.5" y="105.5" width="43" height="43" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="105" y="127" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#9a6a00">?</text>
<rect x="129.5" y="105.5" width="43" height="43" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="151" y="127" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#9a6a00">?</text>
<rect x="175.5" y="105.5" width="43" height="43" rx="5" fill="#fff3d6" stroke="#e8b64c" stroke-width="0.8"/>
<text x="197" y="127" text-anchor="middle" dominant-baseline="central" font-size="15" fill="#9a6a00">?</text>

<text x="252" y="70" font-size="13" fill="#4a4a46">三条约束，局部计数一条都用不上：</text>
<text x="252" y="96" font-size="12.5" fill="#6d6b64">　1 @ (1,1)　2 格未开，还差 1 颗</text>
<text x="252" y="118" font-size="12.5" fill="#6d6b64">　2 @ (1,2)　3 格未开，还差 2 颗</text>
<text x="252" y="140" font-size="12.5" fill="#6d6b64">　1 @ (1,3)　4 格未开，还差 1 颗</text>
<text x="252" y="166" font-size="12.5" font-weight="500" fill="#b32d2d">没有一格的「未开数」等于「待定雷数」</text>

<line x1="36" y1="186" x2="644" y2="186" stroke="#e2dfd8" stroke-width="1"/>

<text x="36" y="212" font-size="13.5" font-weight="500" fill="#1f1f1d">但 2 的格子集合，把 1 的整个包住了</text>

<rect x="60" y="228" width="38" height="28" rx="5" fill="#e8f1fb" stroke="#7fb3e0" stroke-width="0.8"/>
<text x="79" y="242" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1f5c8f">21</text>
<rect x="102" y="228" width="38" height="28" rx="5" fill="#e8f1fb" stroke="#7fb3e0" stroke-width="0.8"/>
<text x="121" y="242" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1f5c8f">22</text>
<rect x="144" y="228" width="38" height="28" rx="5" fill="#e8f1fb" stroke="#7fb3e0" stroke-width="0.8"/>
<text x="163" y="242" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#1f5c8f">23</text>
<text x="192" y="242" dominant-baseline="central" font-size="12.5" fill="#4a4a46">= 2 颗雷　<tspan fill="#1f5c8f">②</tspan></text>

<rect x="60" y="276" width="38" height="28" rx="5" fill="#f1ecfa" stroke="#a894d8" stroke-width="0.8"/>
<text x="79" y="290" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5b4292">21</text>
<rect x="102" y="276" width="38" height="28" rx="5" fill="#f1ecfa" stroke="#a894d8" stroke-width="0.8"/>
<text x="121" y="290" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#5b4292">22</text>
<text x="152" y="290" dominant-baseline="central" font-size="12.5" fill="#4a4a46">= 1 颗雷　<tspan fill="#5b4292">①</tspan></text>

<path d="M252 290 L368 290" fill="none" stroke="#b8b5ad" stroke-width="1.2" marker-end="url(#a2)"/>
<text x="310" y="276" text-anchor="middle" font-size="12" fill="#8a8880">② − ①</text>

<text x="380" y="232" font-size="12.5" fill="#4a4a46">只剩 23 这一格</text>
<text x="380" y="258" font-size="13" fill="#4a4a46">雷数：2 − 1 = <tspan font-weight="500" fill="#b32d2d">1 颗</tspan></text>
<text x="380" y="288" font-size="13.5" font-weight="500" fill="#1a6b4d">→ (2,3) 必然是雷</text>

<text x="36" y="332" font-size="11" fill="#a8a59c">坐标记作「行列」：(2,3) = 第 2 行第 3 列。② 是数字 2 @ (1,2) 四周的未开格，① 是数字 1 @ (1,1) 四周的未开格。</text>

</g>
</svg>
